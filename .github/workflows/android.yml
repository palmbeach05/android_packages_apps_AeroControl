name: Android CI

on:
  push:
    branches: [ "updates" ]
  pull_request:
    branches: [ "updates" ]

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: ${{ github.workspace }}/.android-sdk
      ANDROID_SDK_ROOT: ${{ github.workspace }}/.android-sdk

    steps:
      - uses: actions/checkout@v6

      # sdkmanager requires a current Java runtime.
      - name: Set up JDK 17 for Android SDK tools
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install isolated legacy Android SDK
        shell: bash
        run: |
          set -euo pipefail

          sdk_log="${RUNNER_TEMP}/android-sdk-setup.log"
          tools_zip="${RUNNER_TEMP}/commandlinetools.zip"

          mkdir -p "${ANDROID_SDK_ROOT}/cmdline-tools/latest"

          curl --fail --location --retry 3 \
            --output "${tools_zip}" \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip

          unzip -q "${tools_zip}" -d "${RUNNER_TEMP}/command-line-tools"
          mv "${RUNNER_TEMP}/command-line-tools/cmdline-tools/"* \
            "${ANDROID_SDK_ROOT}/cmdline-tools/latest/"

          sdkmanager="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"

          {
            yes | "${sdkmanager}" --sdk_root="${ANDROID_SDK_ROOT}" --licenses
            "${sdkmanager}" --sdk_root="${ANDROID_SDK_ROOT}" \
              "platforms;android-22" \
              "build-tools;26.0.2"
            "${sdkmanager}" --sdk_root="${ANDROID_SDK_ROOT}" --list_installed
          } 2>&1 | tee "${sdk_log}"

          if grep -E \
            'Not a number: 37\.1|SAXParseException|NumberFormatException' \
            "${sdk_log}"; then
            echo "Android SDK metadata parsing error detected during SDK setup." >&2
            exit 1
          fi

      # AGP 3.0.1 and Gradle 4.1 require JDK 8.
      - name: Set up JDK 8 for Gradle
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "8"
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Assemble debug APK
        shell: bash
        run: |
          set -o pipefail

          build_log="${RUNNER_TEMP}/assemble-debug.log"

          ./gradlew assembleDebug 2>&1 | tee "${build_log}"

          if grep -E \
            'Not a number: 37\.1|SAXParseException|NumberFormatException' \
            "${build_log}"; then
            echo "Android SDK metadata parsing error detected during assembleDebug." >&2
            exit 1
          fi

      - name: Run Android lint
        run: ./gradlew lint

      - name: Generate APK build metadata
        shell: bash
        run: |
          set -euo pipefail

          apk="build/outputs/apk/debug/AeroControl-debug.apk"
          metadata="build/outputs/apk/debug/AeroControl-debug-metadata.txt"

          test -f "${apk}"

          {
            echo "Commit SHA: ${GITHUB_SHA}"
            echo
            echo "Java version:"
            java -version 2>&1
            echo
            echo "Gradle version:"
            ./gradlew --version
            echo
            echo "Installed Android SDK packages:"
            "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" \
              --sdk_root="${ANDROID_SDK_ROOT}" \
              --list_installed
            echo
            echo "APK SHA-256:"
            sha256sum "${apk}"
          } > "${metadata}"

      - name: Upload debug APK and metadata
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: aerocontrol-debug-apk
          path: |
            build/outputs/apk/debug/*.apk
            build/outputs/apk/debug/*-metadata.txt
          if-no-files-found: error

      - name: Upload Android lint reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: android-lint-reports
          path: |
            build/reports/lint-results.html
            build/reports/lint-results.xml
          if-no-files-found: warn
