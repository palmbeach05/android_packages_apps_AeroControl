name: Android CI

on:
  push:
    branches: [ "updates" ]
  pull_request:
    branches: [ "updates" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
    - name: set up JDK 17 for Android SDK tools
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Set up Android SDK
      uses: android-actions/setup-android@v4

    - name: Install Android SDK packages
      run: sdkmanager "platform-tools" "platforms;android-22" "build-tools;26.0.2"

    - name: Accept Android SDK licenses
      run: yes | sdkmanager --licenses
      
    - name: Set up JDK 8 for Gradle
      uses: actions/setup-java@v5
      with:
        java-version: '8'
        distribution: 'temurin'
        cache: gradle
        
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    - name: Assemble debug APK
      run: ./gradlew assembleDebug

    - name: Run Android lint
      run: ./gradlew lint

    - name: Upload debug APK
      if: always()
      uses: actions/upload-artifact@v5
      with:
        name: aerocontrol-debug-apk
        path: build/outputs/apk/debug/*.apk
        if-no-files-found: error

    - name: Upload Android lint reports
      if: always()
      uses: actions/upload-artifact@v5
      with:
        name: android-lint-reports
        path: |
          build/reports/lint-results.html
          build/reports/lint-results.xml
        if-no-files-found: warn
