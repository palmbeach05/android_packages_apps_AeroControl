name: Android CI

on:
  push:
    branches: [ "updates" ]
  pull_request:
    branches: [ "updates" ]

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: ${{ github.workspace }}/.android-sdk
      ANDROID_SDK_ROOT: ${{ github.workspace }}/.android-sdk

    steps:
      - uses: actions/checkout@v6

      - name: Install isolated legacy Android SDK
        shell: bash
        run: |
          set -euo pipefail

          downloads="${RUNNER_TEMP}/android-sdk-downloads"
          unpacked="${RUNNER_TEMP}/android-sdk-unpacked"

          mkdir -p "${downloads}" "${unpacked}" \
            "${ANDROID_SDK_ROOT}/platforms" \
            "${ANDROID_SDK_ROOT}/build-tools"

          curl --fail --location --retry 3 \
            --output "${downloads}/android-22_r02.zip" \
            https://dl.google.com/android/repository/android-22_r02.zip

          curl --fail --location --retry 3 \
            --output "${downloads}/build-tools_r26.0.2-linux.zip" \
            https://dl.google.com/android/repository/build-tools_r26.0.2-linux.zip

          curl --fail --location --retry 3 \
            --output "${downloads}/platform-tools_r26.0.2-linux.zip" \
            https://dl.google.com/android/repository/platform-tools_r26.0.2-linux.zip

          unzip -q "${downloads}/android-22_r02.zip" \
            -d "${unpacked}/platform"
          mv "${unpacked}/platform/android-5.1.1" \
            "${ANDROID_SDK_ROOT}/platforms/android-22"

          unzip -q "${downloads}/build-tools_r26.0.2-linux.zip" \
            -d "${unpacked}/build-tools"
          mv "${unpacked}/build-tools/android-8.1.0" \
            "${ANDROID_SDK_ROOT}/build-tools/26.0.2"

          unzip -q "${downloads}/platform-tools_r26.0.2-linux.zip" \
            -d "${ANDROID_SDK_ROOT}"

          # AGP 3.0.1 can read legacy source.properties metadata.
          # It cannot parse modern package.xml metadata with base-extension.
          if find "${ANDROID_SDK_ROOT}" -name package.xml -print -quit \
            | grep -q .; then
            echo "Unexpected package.xml in isolated Android SDK." >&2
            exit 1
          fi

          {
            echo "platforms;android-22"
            echo "build-tools;26.0.2"
            echo "platform-tools;26.0.2"
          } > "${RUNNER_TEMP}/installed-sdk-packages.txt"

      # AGP 3.0.1 and Gradle 4.1 require JDK 8.
      - name: Set up JDK 8 for Gradle
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "8"
          cache: gradle

      - name: Assemble debug APK
        shell: bash
        run: |
          set -o pipefail

          # This project does not use the NDK. GitHub runners set an NDK
          # environment variable that makes AGP 3.0.1 parse NDK 27 metadata.
          unset ANDROID_NDK_HOME ANDROID_NDK_ROOT NDK_HOME NDK_ROOT

          build_log="${RUNNER_TEMP}/assemble-debug.log"

          ./gradlew --no-daemon assembleDebug 2>&1 | tee "${build_log}"

          if grep -E \
            'Not a number: 37\.1|SAXParseException|NumberFormatException' \
            "${build_log}"; then
            echo "Android SDK metadata parsing error detected during assembleDebug." >&2
            exit 1
          fi

      - name: Run Android lint
        run: ./gradlew lint

      - name: Generate APK build metadata
        shell: bash
        run: |
          set -euo pipefail

          apk="build/outputs/apk/debug/AeroControl-debug.apk"
          metadata="build/outputs/apk/debug/AeroControl-debug-metadata.txt"

          test -f "${apk}"

          {
            echo "Commit SHA: ${GITHUB_SHA}"
            echo
            echo "Java version:"
            java -version 2>&1
            echo
            echo "Gradle version:"
            ./gradlew --version
            echo
            echo "Installed Android SDK packages:"
            cat "${RUNNER_TEMP}/installed-sdk-packages.txt"
            echo
            echo "APK SHA-256:"
            sha256sum "${apk}"
          } > "${metadata}"

      - name: Upload debug APK and metadata
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: aerocontrol-debug-apk
          path: |
            build/outputs/apk/debug/*.apk
            build/outputs/apk/debug/*-metadata.txt
          if-no-files-found: warn

      - name: Upload Android lint reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: android-lint-reports
          path: |
            build/reports/lint-results.html
            build/reports/lint-results.xml
          if-no-files-found: warn
